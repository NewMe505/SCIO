name: Bug
description: Report incorrect behavior
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / trace ID
      render: text
