name: nightly-evals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [sonnet_only, sonnet_opus_advisor, opus_only]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --group dev

      # The Anthropic key is a placeholder on this project (ledger I-019): the Fake provider
      # measures control-flow cost at real-model prices. Set ANTHROPIC_API_KEY as a repository
      # secret to run live; the step below switches automatically.
      - name: Choose provider
        id: provider
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then echo "name=anthropic" >> "$GITHUB_OUTPUT"; else echo "name=fake" >> "$GITHUB_OUTPUT"; fi

      - name: Capability suite (${{ matrix.config }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python -m evals.runner --suite capability --provider ${{ steps.provider.outputs.name }} \
            --config evals/configs/${{ matrix.config }}.yaml --trials 5 --out evals/results

      - name: Regression suite (${{ matrix.config }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python -m evals.runner --suite regression --provider ${{ steps.provider.outputs.name }} \
            --config evals/configs/${{ matrix.config }}.yaml --trials 5 --out evals/results

      - name: Post results to the job summary
        if: always()
        run: |
          echo "### config: ${{ matrix.config }} · provider: ${{ steps.provider.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ matrix.config }}
          path: evals/results
          retention-days: 30
