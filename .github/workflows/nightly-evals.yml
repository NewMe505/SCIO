name: nightly-evals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [sonnet_only, sonnet_opus_advisor, opus_only]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --group dev

      # Live runs need an ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN repository secret; a Claude
      # login profile cannot run here (interactive, machine-bound), so the local scheduled task
      # (scripts/nightly_live.py) is the live path until a secret exists. Without one the Fake
      # provider measures control-flow cost at real-model prices. Each suite has a cost cap
      # (--max-usd) that applies on either provider; on the Fake it is never reached.
      - name: Choose provider
        id: provider
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}${ANTHROPIC_AUTH_TOKEN}" ]; then echo "name=anthropic" >> "$GITHUB_OUTPUT"; else echo "name=fake" >> "$GITHUB_OUTPUT"; fi

      - name: Capability suite (${{ matrix.config }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          uv run python -m evals.runner --suite capability --provider ${{ steps.provider.outputs.name }} \
            --config evals/configs/${{ matrix.config }}.yaml --trials 3 --parallel 3 --max-usd 6 --out evals/results

      - name: Regression suite (${{ matrix.config }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          uv run python -m evals.runner --suite regression --provider ${{ steps.provider.outputs.name }} \
            --config evals/configs/${{ matrix.config }}.yaml --trials 3 --parallel 3 --max-usd 8 --out evals/results

      - name: Post results to the job summary
        if: always()
        run: |
          echo "### config: ${{ matrix.config }} · provider: ${{ steps.provider.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ matrix.config }}
          path: evals/results
          retention-days: 30
