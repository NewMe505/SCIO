name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SCIO_PROVIDER_OVERRIDE: fake
  SCIO_PRODUCT_SANDBOX_BACKEND: local  # the Fake CLI tests never probe the runner's daemon
  PYTHONUTF8: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    # A runaway guard, not a speed target (I-094): the job measured 12.9, 14.3 and 15.2 min
    # over M11 slices 1 to 3 (tests 512 to 615 s, regression evals about 265 s), so 15 cut
    # it off; keep the evals in this job, the one the ruleset requires.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # The node-ts profile's tests run the TypeScript walking skeleton on Node 22's type
      # stripping (M10); without Node they skip, so this step is what makes them count.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: uv sync --all-extras --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Tests (Fake provider, offline)
        run: uv run pytest --cov=scio --cov=evals --cov-report=term-missing --durations=15

      - name: Docs checks
        run: uv run python scripts/check_docs.py

      - name: Regression evals (Fake provider)
        run: uv run python -m evals.runner --suite regression --provider fake --trials 5 --min-pass-pow-k 1.0 --out evals/results

      - name: Post eval table to job summary
        if: always()
        run: cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: API docs
        run: uv run python scripts/gen_api_docs.py

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api
          retention-days: 14

  # The Docker sandbox for real (M9, ADR 0013 decision 10): the runner has a daemon, the dev
  # machine does not (I-016). Persistent container, internal network, the egress proxy
  # admitting the registry allowlist only, a product environment inside the container, an
  # http app started and probed inside it.
  docker-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCIO_SANDBOX_DOCKER_IMAGE: scio-sandbox:ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --group dev

      - name: Build the sandbox image
        run: docker build -t scio-sandbox:ci -f docker/sandbox.Dockerfile docker

      - name: Docker sandbox live tests
        run: uv run pytest tests/live/test_docker_live.py -p no:cacheprovider -v -rfEs
