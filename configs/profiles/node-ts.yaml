# Toolchain profile: node-ts (ADR 0014, M10). Data only; the TAP parsers live in
# scio/toolchain/node_ts.py. Node >= 22.18 runs TypeScript directly (type stripping), so the
# walking skeleton tests with the built-in runner and no download; typescript, eslint and
# npm audit form the quality bar and report "skipped: tool absent" until the product's own
# devDependencies are installed (the same rule as the python profile's coverage and build).
name: node-ts
source_suffixes: [".ts", ".tsx", ".mts", ".cts"]
test_dirs: ["tests/", "test/", "__tests__/"]
test_file_suffixes: [".test.ts", ".spec.ts"]
cache_excludes: ["node_modules", "dist", "coverage", ".eslintcache", "*.tsbuildinfo"]
dependency_files:
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - tsconfig.json
  - pyproject.toml
  - requirements.txt
  - go.mod
  - Cargo.toml
env: { NODE_NO_WARNINGS: "1", CI: "1" }
detect: { markers: [package.json, tsconfig.json], all_of: true }
test:
  runner: node:test
  argv: [node, --test, --test-reporter=tap]
  default_targets: ["tests/**/*.test.ts"]   # Node expands the glob itself (no shell)
  path_glob: "{path}/**/*.test.ts"          # a directory target; a *.test.ts path is positional
  filter_flag: "--test-name-pattern"
  exit_codes: { passed: [0], no_tests: [], broken: [9] }   # 9: bad option
  no_tests_patterns: ["# tests 0"]          # no matching files exits 0 with an empty plan
  # exit 0 with every selected test skipped proves nothing (I-097): TAP's counters say so
  skipped_only: { all: ['(?m)^# pass 0$', '(?m)^# skipped [1-9]'], none: [] }
  selector_help: "test file paths like tests/x.test.ts, or --test-name-pattern regexes"
  filter_help: "node --test-name-pattern filter"
lint:
  argv: [node, node_modules/eslint/bin/eslint.js, --format, unix]
  clean_exit_codes: [0, 127]
  findings_exit_codes: [1]
  absent_patterns: ["Cannot find module"]   # eslint not installed; not the agent's problem
# Parses one file the way Node will load it: the strip-mode parser rejects syntax errors and
# non-erasable TypeScript (parameter properties, enums) alike, and executes nothing. Plain
# `node --check` accepts non-erasable syntax that then fails at import time (I-083).
syntax_check_argv:
  - node
  - -e
  - 'const m = require("node:module"), fs = require("node:fs"); m.stripTypeScriptTypes(fs.readFileSync(process.argv[1], "utf8"), { mode: "strip" });'
script_argv: [node]
# Exits 0 when {url} answers below 400; used to probe an app started inside a sandbox (M10).
health_probe_argv:
  - node
  - -e
  - "fetch('{url}').then(r => process.exit(r.status < 400 ? 0 : 1), () => process.exit(1))"
acceptance_dir: tests/acceptance
# The release image (M11): Node 22 runs the TypeScript sources directly (type stripping), so
# the image needs the runtime dependencies only; the scaffold appends ENV / EXPOSE / CMD.
release_image: |
  FROM node:22-slim
  WORKDIR /app
  COPY package*.json ./
  RUN npm install --omit=dev --no-audit --no-fund
  COPY . .
skeleton_command: "node src/main.ts --version"
# What a sandbox image must be able to do for this stack (issue #58, I-101): Node with
# TypeScript type stripping (22.18+), the same check tests/node_support.py makes.
sandbox_probe: [node, -e, "process.exit(['strip', 'transform'].includes(process.features.typescript) ? 0 : 1)"]
# What this profile settles (I-107): see configs/profiles/python.yaml.
fixed_facts: "tests run with node --test on TypeScript through type stripping (no build step), lint with eslint, type checks with tsc, Node 22.18 or newer"
quality_bar_conflicts:
  - pattern: '(?i)\b(?:jest|mocha|vitest|jasmine|ava|karma)\b'
    use: "Tests run with node --test, the node-ts profile's test runner"
  - pattern: '(?i)\bnode(?:\.js)?\s*(?:1[0-9]|2[01])\b'
    use: "Targets Node 22.18 or newer, the node-ts profile's minimum"
command_words: [node, npm, npx]
# Coverage is built into Node 22 (M11): below the floor it exits 1 with "line coverage does
# not meet threshold"; tests are excluded so the floor measures the product's own code.
checks:
  - name: coverage
    argv: [node, --test, --test-reporter=tap, --experimental-test-coverage, "--test-coverage-exclude=tests/**", "--test-coverage-lines={coverage_floor}", "tests/**/*.test.ts"]
    pass_exit_codes: [0]
    skip_exit_codes: []
    skip_patterns: []
    timeout_s: 600
    verify: true                # every product feature run meets the floor (M11, I-091)
  - name: typecheck
    argv: [node, node_modules/typescript/bin/tsc, --noEmit]
    pass_exit_codes: [0]
    skip_exit_codes: []
    skip_patterns: ["Cannot find module"]
    timeout_s: 600
    verify: true                # Node strips types, so only tsc sees a type error (I-091)
  - name: build
    argv: [node, node_modules/typescript/bin/tsc, -p, tsconfig.build.json, --outDir, .scio/sandbox/dist]
    pass_exit_codes: [0]
    skip_exit_codes: []
    skip_patterns: ["Cannot find module"]
    timeout_s: 600
  - name: audit
    argv: [npm, audit, --audit-level=high, --omit=dev]
    pass_exit_codes: [0]
    skip_exit_codes: [127]
    skip_patterns: ["ENOLOCK", "ENOTFOUND", "EAI_AGAIN"]
    timeout_s: 600
runtime:
  env_create_argv: null                     # npm install creates node_modules
  env_dir: node_modules
  env_marker: { posix: node_modules/.package-lock.json, windows: node_modules/.package-lock.json }
  env_interpreter: null                     # node is the host runtime; nothing is rewritten
  install_argv: [npm, install, --no-audit, --no-fund, --save]
  index_allowlist: [registry.npmjs.org]
  app_argv: [node]
  app_default_target: src/main.ts
  test_tools: []
