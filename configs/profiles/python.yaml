# Toolchain profile: python (ADR 0009). Data only; the parsers live in scio/toolchain/python.py.
# These values are the exact commands the graph used before M6, moved here with no change.
name: python
source_suffixes: [".py"]
test_dirs: ["tests/", "test/"]
test_file_prefix: "test_"
# Written to .git/info/exclude (directories get a trailing slash) and used as copytree ignores.
cache_excludes: ["__pycache__", "*.pyc", ".pytest_cache", ".ruff_cache", ".mypy_cache", ".coverage*", "htmlcov"]  # the last two: coverage artifacts (M9)
dependency_files:
  - pyproject.toml
  - requirements.txt
  - requirements-dev.txt
  - setup.py
  - setup.cfg
  - Pipfile
  - poetry.lock
  - uv.lock
  - package.json
  - package-lock.json
  - go.mod
  - Cargo.toml
# Environment every command runs with (the sandbox adds its own).
env: { PYTHONUTF8: "1" }
interpreter: python
test:
  runner: pytest
  argv: [python, -m, pytest, -q, --tb=short, -p, "no:cacheprovider", -rfE, --no-header]
  filter_flag: "-k"
  exit_codes: { passed: [0], no_tests: [5], broken: [2, 3, 4] }
  selector_help: "pytest node ids like tests/test_x.py::test_name, or -k keywords"
  filter_help: "pytest -k filter"
lint:
  argv: [ruff, check, --no-cache, --select, "E9,F63,F7,F82,F821", --output-format, concise]
  clean_exit_codes: [0, 127]   # 127: the linter is not installed; not the agent's problem
  findings_exit_codes: [1]
script_argv: [python]
# Exits 0 when {url} answers below 400; used to probe an app started inside a sandbox (M10).
health_probe_argv:
  - python
  - -c
  - "import sys, urllib.request\ntry:\n    sys.exit(0 if urllib.request.urlopen('{url}', timeout=1).status < 400 else 1)\nexcept Exception:\n    sys.exit(1)\n"
# The product-ready quality bar (ADR 0007 decision 5), run by `integrate` after the suite and
# lint (M9). A check whose tool is absent is reported as skipped, never counted as a pass; a
# product's own CI installs the tools. Outputs go under .scio/sandbox/, which is git-ignored.
checks:
  - name: coverage
    argv: [python, -m, pytest, -q, -p, "no:cacheprovider", --no-header, --cov, --cov-report=term-missing:skip-covered, "--cov-fail-under={coverage_floor}"]
    pass_exit_codes: [0]
    skip_exit_codes: [4]        # pytest usage error: pytest-cov is not installed
    skip_patterns: ["unrecognized arguments: --cov", "No module named"]
    timeout_s: 600
    verify: true                # every product feature run meets the floor (M11, I-091)
  - name: build
    argv: [python, -m, build, --wheel, --outdir, .scio/sandbox/dist]
    pass_exit_codes: [0]
    skip_exit_codes: []
    skip_patterns: ["No module named build"]
    timeout_s: 600
  - name: audit
    argv: [python, -m, pip_audit, --progress-spinner, "off"]
    pass_exit_codes: [0]
    skip_exit_codes: []
    skip_patterns: ["No module named pip_audit"]
    timeout_s: 600
# Runtime (M9): the product's own environment, the install phase and how the app is started.
# `python` in every argv is rewritten by the sandbox to the product environment's interpreter
# once `ensure_product_env` has created it. The venv is plain (no --system-site-packages: the
# base interpreter's packages differ per machine, I-074); on a local sandbox a .pth file makes
# SCIO's own environment visible so `test_tools` need no download, elsewhere they are installed.
runtime:
  env_create_argv: [python, -m, venv]
  env_dir: .scio/sandbox/venv
  env_interpreter: { posix: bin/python, windows: Scripts/python.exe }   # the marker too
  install_argv: [python, -m, pip, install, --disable-pip-version-check, --no-input, --quiet]
  index_allowlist: [pypi.org, files.pythonhosted.org]
  app_argv: [python, -m]
  test_tools: ["pytest>=8.3", "pytest-cov>=6.0"]
# The release image (M11): how a container gets the product and its approved dependencies
# (read from pyproject.toml at build time, so a dependency added later is in the image too);
# the scaffold appends ENV HOST / EXPOSE / CMD from the app's start command.
release_image: |
  FROM python:3.12-slim
  WORKDIR /app
  COPY . .
  RUN python -c "import subprocess, sys, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project'].get('dependencies', []); deps and subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-cache-dir', *deps])"
# Product skeleton and detection (M10, ADR 0014).
acceptance_dir: tests/acceptance
skeleton_command: "python -m {name} --version"
command_words: [python, pytest]
detect: { markers: [pyproject.toml, setup.py, setup.cfg, requirements.txt], all_of: false }
