[project]
name = "scio"
version = "0.1.0"
description = "Model-agnostic LangGraph framework that takes a software task from spec to merged, tested, documented PR"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0",
    "anthropic>=1.13,<2",
    "openai>=1.60,<4",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30"]
postgres = ["langgraph-checkpoint-postgres>=3.0,<4"]
e2b = ["e2b>=2.0,<3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "pdoc>=15",
]

[project.scripts]
scio-evals = "evals.runner:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scio", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
packages = ["scio", "evals"]
strict = true
warn_unreachable = true
# SDK response objects are dynamic unions; adapters narrow them explicitly.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real provider; needs credentials and SCIO_RUN_LIVE_TESTS=1",
]
